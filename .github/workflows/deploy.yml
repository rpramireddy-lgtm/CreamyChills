name: Deploy Creamy Chills

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci
          REACT_APP_API_URL=https://staging.creamychills.com/api npm run build

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: bitnami
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            export PATH=/opt/bitnami/node/bin:$PATH
            cd /home/bitnami/app
            git pull origin main
            cd server && npm install --production
            cd ../client && npm install && REACT_APP_API_URL=https://staging.creamychills.com/api npm run build
            cd ../server && pm2 restart creamychills
